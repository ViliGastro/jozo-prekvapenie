<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<title>Jožov Osud</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    height: 100vh;
    font-family: 'Poppins', sans-serif;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
}

.card {
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(8px);
    padding: 40px;
    border-radius: 22px;
    border: 2px solid rgba(255,255,255,0.7);
    box-shadow:
        0 0 15px rgba(255,255,255,0.25),
        0 0 40px rgba(255,255,255,0.15),
        0 30px 70px rgba(0,0,0,0.8);
    width: 90%;
    max-width: 520px;
    text-align: center;
    animation: fadeIn 0.8s ease;
}

h1 {
    margin: 0 0 25px;
    color: #ffffff;
    font-weight: 600;
    text-shadow: 0 0 12px rgba(255,255,255,0.35);
}

.output {
    min-height: 90px;
    padding: 20px;
    border: 2px solid rgba(255,255,255,0.8);
    border-radius: 14px;
    box-shadow:
        inset 0 0 15px rgba(255,255,255,0.15),
        0 0 18px rgba(255,255,255,0.25);
    margin-bottom: 30px;
    font-size: 18px;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
}

.output.animate {
    animation: shake 0.4s ease;
}

.buttons {
    display: flex;
    gap: 22px;
    justify-content: center;
}

button {
    padding: 14px 30px;
    font-size: 16px;
    border-radius: 40px;
    cursor: pointer;
    font-weight: 600;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
}

button:hover {
    transform: translateY(-3px);
}

.go {
    background: rgba(0,0,0,0.6);
    color: #ffffff;
    border: 2px solid rgba(255,255,255,0.6);
    box-shadow: 0 0 15px rgba(255,255,255,0.25);
}

.skip {
    background: rgba(255,255,255,0.15);
    color: #ffffff;
    border: 2px solid rgba(255,255,255,0.5);
    box-shadow: 0 0 12px rgba(255,255,255,0.2);
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes shake {
    0% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    50% { transform: translateX(6px); }
    75% { transform: translateX(-4px); }
    100% { transform: translateX(0); }
}
</style>
</head>
<body>

<div class="card">
    <h1>Jožov Osudový Generátor</h1>

    <div class="output" id="vystup">
        Klikni. Rozhodnutie už existuje.
    </div>

    <div class="buttons">
        <button class="go" onclick="istNaTo()">Ísť na to</button>
        <button class="skip" onclick="obist()">Obísť</button>
    </div>
</div>

<audio id="clickSound">
    <source src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=" type="audio/wav">
</audio>

<script>
let moznosti = [
    "Výborne. Presne toto si si nemal vybrať.",
    "Jožo, tvár sa, že máš plán.",
    "Osud rozhodol. Ty to len odsúhlasíš.",
    "Technicky si nevinný. Prakticky nie.",
    "Ak to pokazíš, povedz, že to bol experiment.",
    "Ticho. Takto znie zlé rozhodnutie.",
    "Gratulujem. Aktivoval si následky.",
    "Nikto ťa nenútil. Okrem teba."
];

moznosti = moznosti.sort(() => Math.random() - 0.5);
let index = 0;

function playSound() {
    const s = document.getElementById("clickSound");
    s.currentTime = 0;
    s.play();
}

function animate(text) {
    const o = document.getElementById("vystup");
    o.classList.remove("animate");
    void o.offsetWidth;
    o.textContent = text;
    o.classList.add("animate");
}

function istNaTo() {
    playSound();
    if (index < moznosti.length) animate(moznosti[index++]);
    else animate("Koniec možností. Zostáva realita.");
}

function obist() {
    playSound();
    if (index < moznosti.length) {
        index++;
        animate("Preskočené. Zaznamenané.");
    } else animate("Už niet čo obchádzať.");
}
</script>

</body>
</html>
