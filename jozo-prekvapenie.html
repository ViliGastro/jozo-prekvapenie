<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<title>Jožov Osud</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    height: 100vh;
    font-family: 'Poppins', sans-serif;

    /* TVOJE POZADIE */
    background-image:
        linear-gradient(rgba(5,15,35,0.65), rgba(5,15,35,0.65)),
        url("pozadie.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    display: flex;
    align-items: center;
    justify-content: center;
}

.card {
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(6px);
    padding: 40px;
    border-radius: 22px;
    box-shadow: 0 30px 70px rgba(0,0,0,0.5);
    width: 90%;
    max-width: 520px;
    text-align: center;
    animation: fadeIn 0.8s ease;
}

h1 {
    margin: 0 0 25px;
    color: #000;
    font-weight: 600;
}

.output {
    min-height: 90px;
    padding: 20px;
    border: 2px solid #122b5a;
    border-radius: 14px;
    box-shadow: inset 0 0 12px rgba(0,0,0,0.1);
    margin-bottom: 30px;
    font-size: 18px;
    color: #000;
    display: flex;
    align-items: center;
    justify-content: center;
}

.output.animate {
    animation: shake 0.4s ease;
}

.buttons {
    display: flex;
    gap: 22px;
    justify-content: center;
}

button {
    padding: 14px 30px;
    font-size: 16px;
    border-radius: 40px;
    border: none;
    cursor: pointer;
    font-weight: 600;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
}

button:hover {
    transform: translateY(-3px);
    box-shadow: 0 16px 35px rgba(0,0,0,0.4);
}

.go {
    background: #122b5a;
    color: #fff;
}

.skip {
    background: #d0d0d0;
    color: #000;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes shake {
    0% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    50% { transform: translateX(6px); }
    75% { transform: translateX(-4px); }
    100% { transform: translateX(0); }
}
</style>
</head>
<body>

<div class="card">
    <h1>Jožov Osudový Generátor</h1>

    <div class="output" id="vystup">
        Klikni. Rozhodnutie už existuje.
    </div>

    <div class="buttons">
        <button class="go" onclick="istNaTo()">Ísť na to</button>
        <button class="skip" onclick="obist()">Obísť</button>
    </div>
</div>

<audio id="clickSound">
    <source src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=" type="audio/wav">
</audio>

<script>
let moznosti = [
    "Výborne. Presne toto si si nemal vybrať.",
    "Jožo, tvár sa, že máš plán.",
    "Osud rozhodol. Ty to len odsúhlasíš.",
    "Technicky si nevinný. Prakticky nie.",
    "Ak to pokazíš, povedz, že to bol experiment.",
    "Ticho. Takto znie zlé rozhodnutie.",
    "Gratulujem. Aktivoval si následky.",
    "Nikto ťa nenútil. Okrem teba."
];

moznosti = moznosti.sort(() => Math.random() - 0.5);
let index = 0;

function playSound() {
    const s = document.getElementById("clickSound");
    s.currentTime = 0;
    s.play();
}

function animate(text) {
    const o = document.getElementById("vystup");
    o.classList.remove("animate");
    void o.offsetWidth;
    o.textContent = text;
    o.classList.add("animate");
}

function istNaTo() {
    playSound();
    if (index < moznosti.length) animate(moznosti[index++]);
    else animate("Koniec možností. Zostáva realita.");
}

function obist() {
    playSound();
    if (index < moznosti.length) {
        index++;
        animate("Preskočené. Zaznamenané.");
    } else animate("Už niet čo obchádzať.");
}
</script>

</body>
</html>
